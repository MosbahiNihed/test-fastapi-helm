apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.liquibase }}
      {{- if .enabled }}
      # Migrations run before the app: wait for PostgreSQL, then liquibase update.
      initContainers:
        - name: wait-for-db
          image: {{ .waitImage | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ .DB_HOST }} -p {{ .DB_PORT }}; do echo "waiting for database"; sleep 2; done
        - name: liquibase
          image: {{ include "test-fastapi.liquibaseImage" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["update"]
          env:
            - name: LIQUIBASE_COMMAND_URL
              value: "jdbc:postgresql://{{ .DB_HOST }}:{{ .DB_PORT }}/{{ .DB_NAME }}"
            - name: LIQUIBASE_COMMAND_USERNAME
              value: {{ .DB_USER | quote }}
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .passwordSecret.name }}
                  key: {{ .passwordSecret.key }}
            - name: LIQUIBASE_COMMAND_CONTEXTS
              value: {{ .contexts | quote }}
          resources:
            {{- toYaml .resources | nindent 12 }}
      {{- end }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- include "test-fastapi.env" . | trim | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessPath }}
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
